{{ define "main" }}
<section class="page-header container">
  <p class="eyebrow">{{ .Data.Singular | default "Term" }}</p>
  <h1>{{ .Title }}</h1>
</section>

<section class="container section">
  <div class="stack-list">
    {{ range .Pages.ByDate.Reverse }}
      {{ partial "post-card.html" . }}
    {{ else }}
      <p class="muted">暂无内容。</p>
    {{ end }}
  </div>
</section>
{{ end }}
