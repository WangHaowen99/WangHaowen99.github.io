<!doctype html>
<html lang="{{ site.Language.Locale | default "zh-CN" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  {{ $searchExcluded := or (not .IsPage) (eq (.Param "searchExclude") true) }}
  <body{{ if $searchExcluded }} data-pagefind-ignore{{ end }}>
    {{ partial "nav.html" . }}
    <main class="site-main">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    <script src="{{ "js/pwa.js" | relURL }}" defer></script>
  </body>
</html>
